name: Build clean Android APK
on: { workflow_dispatch: {}, push: { branches: [ main ] } }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Ensure Android 35 build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify Android toolchain
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: Verify project source inputs
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/il/yomanhasofer/goldnew/MainActivity.java
          test -f app/src/main/java/il/yomanhasofer/goldnew/GoldJournalView.java
          test -f app/src/main/java/il/yomanhasofer/goldnew/TimerService.java
          ! grep -R "androidx\|com.android.support" app/src/main/java app/src/main/AndroidManifest.xml
      - name: Compile debug sources first
        run: gradle :app:compileDebugJavaWithJavac --no-daemon --stacktrace
      - name: Verify merged manifest
        run: gradle :app:processDebugMainManifest --no-daemon --stacktrace
      - name: Build debug APK and run lint
        run: gradle :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK output and identity
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(apkanalyzer manifest application-id "$APK")" = "il.yomanhasofer.goldnew"
          test "$(apkanalyzer manifest version-code "$APK")" = "136"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: yoman-hasofer-gold-new-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/reports/lint-results-debug.html
