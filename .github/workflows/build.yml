name: Build clean Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q "יויו.zip" -d project
          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Ensure Android 35 build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify project
        working-directory: project
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/il/yomanhasofer/goldnew/MainActivity.java
          test -f app/src/main/java/il/yomanhasofer/goldnew/GoldJournalView.java
          test -f app/src/main/java/il/yomanhasofer/goldnew/TimerService.java

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" > project/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yoman-hasofer-gold-new-apk
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/app/build/outputs/apk/debug/app-debug.apk.sha256
